name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - run: go build -o decl-parser .
        working-directory: packages/goast/tools/decl-parser

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm format

      - run: pnpm test

      - run: pnpm typecheck
